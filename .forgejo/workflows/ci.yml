# File: .forgejo/workflows/ci.yml
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PLUGIN_SLUG: argentwolf-post-notifier
  WORDPRESS_PACKAGE_VERSION: '7.1.2'
  PLUGIN_CHECK_VERSION: '2.1.0'
  PLUGIN_CHECK_SHA256: '6ff4bd2145f3befcf907df158cc466b1649dafed5686de8369907403c3013fc4'
  WP_CLI_VERSION: '2.12.0'
  WP_CLI_SHA512: 'be928f6b8ca1e8dfb9d2f4b75a13aa4aee0896f8a9a0a1c45cd5d2c98605e6172e6d014dda2e27f88c98befc16c040cbb2bd1bfa121510ea5cdf5f6a30fe8832'
  VERIFICATION_VERSION: '1.0.2'
  VERIFICATION_SHA256: 'e5ee91ce1d4514eee8f7a5deb98211ed544c801e40f350ffed7031d83c460ca8'

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: forgejo-workstation
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            image: forgejo.argentwolf.org/alan/wp-plugin-argentwolf-post-notifier/ci-php@sha256:22dd9b45874452a5da42870b41f33b80d9af6c58c2f0aaa37f800619fc275e95
          - php: '8.5'
            image: forgejo.argentwolf.org/alan/wp-plugin-argentwolf-post-notifier/ci-php@sha256:f0b19c7643297e618f50f02853a64305f87988ad0f03bcbb7b2489450c435ace
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Verify shared PHP CI image
        run: argentwolf-verify-php-ci-image

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Run PHP quality gates
        run: composer test

  wordpress:
    name: WordPress ${{ matrix.wordpress }} / Email Verification ${{ matrix.verification }}
    runs-on: forgejo-workstation
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        wordpress:
          - '7.0.6'
          - '7.1.2'
        verification:
          - '0.3.4'
          - '1.0.2'
    container:
      image: forgejo.argentwolf.org/alan/wp-plugin-argentwolf-post-notifier/ci-php@sha256:22dd9b45874452a5da42870b41f33b80d9af6c58c2f0aaa37f800619fc275e95
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: wordpress_test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Verify shared PHP CI image
        run: argentwolf-verify-php-ci-image

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install released verification companion
        run: >-
          bash bin/install-verification-companion.sh
          "${{ matrix.verification }}"
          /tmp/argentwolf-email-verification.php

      - name: Install WordPress test environment
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          WP_CORE_DIR: /tmp/wordpress
        run: |
          bash bin/install-wp-tests.sh \
            wordpress_test \
            root \
            '' \
            mysql:3306 \
            "${{ matrix.wordpress }}"
          test -r "${WP_TESTS_DIR}/includes/functions.php"
          test -r "${WP_TESTS_DIR}/includes/bootstrap.php"
          test -r "${WP_TESTS_DIR}/wp-tests-config.php"
          test -r "${WP_CORE_DIR}/wp-settings.php"

      - name: Run WordPress integration tests
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          WP_CORE_DIR: /tmp/wordpress
          ARGENTWOLF_EMAIL_VERIFICATION_FILE: /tmp/argentwolf-email-verification.php
          ARGENTWOLF_EMAIL_VERIFICATION_EXPECTED_VERSION: ${{ matrix.verification }}
        run: composer test:integration

  javascript:
    name: JavaScript
    runs-on: forgejo-workstation
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up Node
        uses: https://data.forgejo.org/actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run JavaScript quality gates
        run: |
          npm run check:engines
          npm run lint:js
          npm run lint:css
          npm run lint:md
          npm run test:js
          npm run build

  package:
    name: Distribution package / Plugin Check
    runs-on: forgejo-workstation
    timeout-minutes: 30
    needs:
      - php
      - wordpress
      - javascript
    container:
      image: forgejo.argentwolf.org/alan/wp-plugin-argentwolf-post-notifier/ci-php@sha256:22dd9b45874452a5da42870b41f33b80d9af6c58c2f0aaa37f800619fc275e95
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: wordpress_test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_CLI_ALLOW_ROOT: '1'

    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Verify shared PHP CI image
        run: argentwolf-verify-php-ci-image

      - name: Validate shell helpers
        run: >-
          bash -n
          build/build-plugin.sh
          bin/install-wp-tests.sh
          bin/install-verification-companion.sh
          scripts/build-ci-php-images.sh
          scripts/run-plugin-check.sh
          tests/package-manifest.sh

      - name: Install pinned WP-CLI
        run: |
          set -euo pipefail
          WP_CLI_PHAR="$RUNNER_TEMP/wp-cli-${WP_CLI_VERSION}.phar"
          curl --fail --location --silent --show-error \
            "https://github.com/wp-cli/wp-cli/releases/download/v${WP_CLI_VERSION}/wp-cli-${WP_CLI_VERSION}.phar" \
            --output "$WP_CLI_PHAR"
          printf '%s  %s\n' "$WP_CLI_SHA512" "$WP_CLI_PHAR" | sha512sum -c -
          install -m 0755 "$WP_CLI_PHAR" /usr/local/bin/wp
          test "$(wp cli version | awk '{print $2}')" = "$WP_CLI_VERSION"

      - name: Build package
        run: composer build

      - name: Verify reproducible package and checksum
        run: |
          set -euo pipefail
          VERSION="$(php -r "require 'src/Version.php'; echo \\ArgentWolf\\PostNotifier\\Version::PLUGIN;")"
          ARCHIVE="dist/argentwolf-post-notifier-${VERSION}.zip"
          FIRST_SHA256="$(sha256sum "${ARCHIVE}" | awk '{print $1}')"
          composer build
          SECOND_SHA256="$(sha256sum "${ARCHIVE}" | awk '{print $1}')"
          test "${FIRST_SHA256}" = "${SECOND_SHA256}"
          cd dist
          sha256sum -c SHA256SUMS

      - name: Install WordPress runtime
        env:
          WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
        run: |
          set -euo pipefail
          WP_ROOT="$RUNNER_TEMP/wordpress"
          mkdir -p "$WP_ROOT" "$WP_CLI_CACHE_DIR"
          wp core download \
            --path="$WP_ROOT" \
            --version="$WORDPRESS_PACKAGE_VERSION" \
            --force
          wp config create \
            --path="$WP_ROOT" \
            --dbname=wordpress_test \
            --dbuser=root \
            --dbpass='' \
            --dbhost=mysql:3306 \
            --skip-check
          wp core install \
            --path="$WP_ROOT" \
            --url='http://post-notifier-ci.invalid' \
            --title='Post Notifier CI' \
            --admin_user=ci-admin \
            --admin_password='ci-only-password-not-a-secret' \
            --admin_email='ci@example.invalid' \
            --skip-email
          wp config set WP_DEBUG true --raw --path="$WP_ROOT"
          wp config set WP_DEBUG_LOG true --raw --path="$WP_ROOT"
          wp config set WP_DEBUG_DISPLAY false --raw --path="$WP_ROOT"
          test "$(wp core version --path="$WP_ROOT")" = "$WORDPRESS_PACKAGE_VERSION"

      - name: Install qualified verification companion
        run: |
          set -euo pipefail
          WP_ROOT="$RUNNER_TEMP/wordpress"
          COMPANION_ZIP="$RUNNER_TEMP/argentwolf-email-verification-${VERIFICATION_VERSION}.zip"
          curl --fail --location --silent --show-error \
            "https://forgejo.argentwolf.org/alan/wp-plugin-argentwolf-email-verification/releases/download/v${VERIFICATION_VERSION}/argentwolf-email-verification-${VERIFICATION_VERSION}.zip" \
            --output "$COMPANION_ZIP"
          printf '%s  %s\n' "$VERIFICATION_SHA256" "$COMPANION_ZIP" | sha256sum -c -
          wp plugin install "$COMPANION_ZIP" --activate --path="$WP_ROOT"
          test "$(wp plugin get argentwolf-email-verification --field=version --path="$WP_ROOT")" = "$VERIFICATION_VERSION"
          wp plugin is-active argentwolf-email-verification --path="$WP_ROOT"

      - name: Install exact package candidate
        run: |
          set -euo pipefail
          WP_ROOT="$RUNNER_TEMP/wordpress"
          VERSION="$(php -r "require 'src/Version.php'; echo \\ArgentWolf\\PostNotifier\\Version::PLUGIN;")"
          ZIP="$FORGEJO_WORKSPACE/dist/${PLUGIN_SLUG}-${VERSION}.zip"
          wp plugin install "$ZIP" --activate --path="$WP_ROOT"
          test "$(wp plugin get "$PLUGIN_SLUG" --field=version --path="$WP_ROOT")" = "$VERSION"
          wp plugin is-active "$PLUGIN_SLUG" --path="$WP_ROOT"

          EXTRACTED="$RUNNER_TEMP/package-extracted"
          rm -rf "$EXTRACTED"
          mkdir -p "$EXTRACTED"
          unzip -q "$ZIP" -d "$EXTRACTED"
          diff -qr "$EXTRACTED/$PLUGIN_SLUG" "$WP_ROOT/wp-content/plugins/$PLUGIN_SLUG"
          echo 'INSTALLED_PACKAGE_BYTE_IDENTITY=PASS'

      - name: Install pinned Plugin Check
        run: |
          set -euo pipefail
          WP_ROOT="$RUNNER_TEMP/wordpress"
          PCP_ZIP="$RUNNER_TEMP/plugin-check-${PLUGIN_CHECK_VERSION}.zip"
          curl --fail --location --silent --show-error \
            "https://downloads.wordpress.org/plugin/plugin-check.${PLUGIN_CHECK_VERSION}.zip" \
            --output "$PCP_ZIP"
          printf '%s  %s\n' "$PLUGIN_CHECK_SHA256" "$PCP_ZIP" | sha256sum -c -
          wp plugin install "$PCP_ZIP" --activate --path="$WP_ROOT"
          test "$(wp plugin get plugin-check --field=version --path="$WP_ROOT")" = "$PLUGIN_CHECK_VERSION"

      - name: Run Plugin Check gates
        run: |
          set -euo pipefail
          WP_ROOT="$RUNNER_TEMP/wordpress"
          REPORT_DIR="$FORGEJO_WORKSPACE/build/plugin-check"
          rm -f "$WP_ROOT/wp-content/debug.log"
          bash scripts/run-plugin-check.sh "$WP_ROOT" "$REPORT_DIR"

      - name: WP_DEBUG gate
        if: always()
        run: |
          set -euo pipefail
          WP_ROOT="$RUNNER_TEMP/wordpress"
          DEBUG_LOG="$WP_ROOT/wp-content/debug.log"
          REPORT_DIR="$FORGEJO_WORKSPACE/build/plugin-check"
          mkdir -p "$REPORT_DIR"
          if [[ -f "$DEBUG_LOG" ]]; then
            cp "$DEBUG_LOG" "$REPORT_DIR/wp-debug.log"
            if grep -Ei \
              'PHP (Fatal error|Parse error|Warning|Deprecated|Notice)|WordPress database error|Uncaught' \
              "$DEBUG_LOG" \
              | grep -F "/wp-content/plugins/${PLUGIN_SLUG}/" \
              > "$REPORT_DIR/post-notifier-debug-findings.txt"; then
              cat "$REPORT_DIR/post-notifier-debug-findings.txt"
              exit 1
            fi
          else
            printf 'debug.log absent\n' > "$REPORT_DIR/wp-debug.log"
          fi
          echo 'POST_NOTIFIER_WP_DEBUG_GATE=PASS'

      - name: Reverify package checksum
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum -c SHA256SUMS
          )

      - name: Upload qualified CI package
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: argentwolf-post-notifier-ci-${{ forgejo.sha }}
          path: |
            dist/argentwolf-post-notifier-*.zip
            dist/SHA256SUMS
            build/plugin-check/*.txt
            build/plugin-check/*.log
          if-no-files-found: error

# EOF: .forgejo/workflows/ci.yml
