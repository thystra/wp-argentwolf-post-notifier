# File: .forgejo/workflows/ci.yml
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: forgejo-workstation
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            image: forgejo.argentwolf.org/alan/wp-plugin-argentwolf-post-notifier/ci-php@sha256:22dd9b45874452a5da42870b41f33b80d9af6c58c2f0aaa37f800619fc275e95
          - php: '8.5'
            image: forgejo.argentwolf.org/alan/wp-plugin-argentwolf-post-notifier/ci-php@sha256:f0b19c7643297e618f50f02853a64305f87988ad0f03bcbb7b2489450c435ace
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Verify shared PHP CI image
        run: argentwolf-verify-php-ci-image

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Run PHP quality gates
        run: composer test

  wordpress:
    name: WordPress 7.0.2 integration
    runs-on: forgejo-workstation
    container:
      image: forgejo.argentwolf.org/alan/wp-plugin-argentwolf-post-notifier/ci-php@sha256:22dd9b45874452a5da42870b41f33b80d9af6c58c2f0aaa37f800619fc275e95
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: wordpress_test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Verify shared PHP CI image
        run: argentwolf-verify-php-ci-image

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install released verification companion
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/thystra/wp-argentwolf-email-verification/v0.3.4/argentwolf-email-verification.php \
            --output /tmp/argentwolf-email-verification-0.3.4.php
          grep -Fq ' * Version: 0.3.4' /tmp/argentwolf-email-verification-0.3.4.php

      - name: Install WordPress test environment
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          WP_CORE_DIR: /tmp/wordpress
        run: |
          bash bin/install-wp-tests.sh \
            wordpress_test \
            root \
            '' \
            mysql:3306 \
            7.0.2
          test -r "${WP_TESTS_DIR}/includes/functions.php"
          test -r "${WP_TESTS_DIR}/includes/bootstrap.php"
          test -r "${WP_TESTS_DIR}/wp-tests-config.php"
          test -r "${WP_CORE_DIR}/wp-settings.php"

      - name: Run WordPress integration tests
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          WP_CORE_DIR: /tmp/wordpress
          ARGENTWOLF_EMAIL_VERIFICATION_FILE: /tmp/argentwolf-email-verification-0.3.4.php
        run: composer test:integration

  javascript:
    name: JavaScript
    runs-on: forgejo-workstation

    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up Node
        uses: https://data.forgejo.org/actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run JavaScript quality gates
        run: |
          npm run check:engines
          npm run lint:js
          npm run lint:css
          npm run lint:md
          npm run test:js
          npm run build

  package:
    name: Distribution package
    runs-on: forgejo-workstation
    needs:
      - php
      - wordpress
      - javascript

    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install --yes zip

      - name: Build package
        run: bash build/build-plugin.sh 0.1.0-alpha.2

      - name: Verify checksum
        run: |
          cd dist
          sha256sum -c SHA256SUMS

      - name: Upload package
        uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: argentwolf-post-notifier-0.1.0-alpha.2
          path: |
            dist/argentwolf-post-notifier-0.1.0-alpha.2.zip
            dist/SHA256SUMS
          if-no-files-found: error
