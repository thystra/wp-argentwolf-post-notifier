# File: .github/workflows/ci.yml
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'

    steps:
      - uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Run PHP quality gates
        run: composer test

  wordpress:
    name: WordPress 7.0.2 integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install Subversion
        run: |
          sudo apt-get update
          sudo apt-get install --yes subversion

      - name: Install WordPress test environment
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          WP_CORE_DIR: /tmp/wordpress
        run: |
          bash bin/install-wp-tests.sh \
            wordpress_test \
            root \
            '' \
            127.0.0.1:3306 \
            7.0.2
          test -r "${WP_TESTS_DIR}/includes/functions.php"
          test -r "${WP_TESTS_DIR}/includes/bootstrap.php"
          test -r "${WP_TESTS_DIR}/wp-tests-config.php"
          test -r "${WP_CORE_DIR}/wp-settings.php"

      - name: Run WordPress integration tests
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          WP_CORE_DIR: /tmp/wordpress
        run: composer test:integration

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run JavaScript quality gates
        run: |
          npm run check:engines
          npm run lint:js
          npm run lint:css
          npm run lint:md
          npm run test:js
          npm run build

  package:
    name: Distribution package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Build package
        run: bash build/build-plugin.sh 0.1.0-alpha.1

      - name: Verify checksum
        run: |
          cd dist
          sha256sum -c SHA256SUMS

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: argentwolf-post-notifier-0.1.0-alpha.1
          path: |
            dist/argentwolf-post-notifier-0.1.0-alpha.1.zip
            dist/SHA256SUMS
